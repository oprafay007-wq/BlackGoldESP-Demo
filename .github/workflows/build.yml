name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -o BlackGold_ESP_AndroidStudio_Project.zip -d project
          find project -name settings.gradle -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle -print -quit)")
          echo "Gradle project: $ROOT"
          cd "$ROOT"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlackGold-Demo-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
